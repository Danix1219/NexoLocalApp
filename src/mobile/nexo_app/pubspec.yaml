name: nexo_app
description: Nexo Local — app móvil (maqueta V1.00.002 completa).
publish_to: "none"
version: 0.3.0+300

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  uuid: ^4.5.1
  # Mapas (mosaicos ArcGIS como la maqueta) y ubicación
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  # Fotos (perfil, trabajos, solicitudes y chat) y enlaces externos
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # Push (spec 050). Sin google-services.json la app funciona sin push.
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  # ML en el teléfono: categoría sugerida por foto (spec 049)
  google_mlkit_image_labeling: ^0.14.1
  # Caché local SQLite por cuenta y cola sin señal (spec 051)
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
