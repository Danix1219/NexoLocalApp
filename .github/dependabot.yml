version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # App Flutter (spec 046): avisos semanales de paquetes con versiones nuevas o vulnerables.
  - package-ecosystem: pub
    directory: /src/mobile/nexo_app
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
