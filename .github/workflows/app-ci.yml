# GENERADO por tools/ci/generar_pipeline.py (spec 047). No editar a mano.
# Cada archivo de prueba es un job: el grafo muestra cada prueba por separado.
name: App CI/CD
on:
  push:
    branches: [develop, main, 'release/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main, 'release/**']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en Play Store (pista según la rama)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  APP_DIR: src/mobile/nexo_app
jobs:
  pipeline:
    name: "Pipeline · al día con las pruebas"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Cada archivo de prueba tiene su job
        run: python3 tools/ci/generar_pipeline.py --check
  preparar:
    name: "Preparar · Flutter y dependencias"
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: Versiones
        run: flutter --version && dart --version
  formato:
    name: "Calidad · formato"
    needs: [preparar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: Calidad · formato
        run: dart format --output=none --set-exit-if-changed lib test
  analisis:
    name: "Calidad · análisis estático"
    needs: [preparar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: Calidad · análisis estático
        run: flutter analyze --no-fatal-infos
  unidad-almacen-local:
    name: "Unidad · almacen-local"
    needs: [formato, analisis]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: flutter test test/unit/almacen_local_test.dart
        run: flutter test --coverage --coverage-path=coverage/unidad-almacen-local.lcov --reporter=expanded test/unit/almacen_local_test.dart
      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cov-unidad-almacen-local
          path: ${{ env.APP_DIR }}/coverage/unidad-almacen-local.lcov
          if-no-files-found: ignore
          retention-days: 7
