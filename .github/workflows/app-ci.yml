  seguridad-transporte:
    name: "Seguridad · transporte"
    needs: [analisis]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: flutter test test/security/transporte_test.dart
        run: flutter test --coverage --coverage-path=coverage/seguridad-transporte.lcov --reporter=expanded test/security/transporte_test.dart
      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cov-seguridad-transporte
          path: ${{ env.APP_DIR }}/coverage/seguridad-transporte.lcov
          if-no-files-found: ignore
          retention-days: 7
  seguridad-secretos:
    name: "Seguridad · secretos en el historial (gitleaks)"
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código con historial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  seguridad-dependencias:
    name: "Seguridad · vulnerabilidades en dependencias (OSV)"
    needs: [preparar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: osv-scanner sobre pubspec.lock
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=src/mobile/nexo_app/pubspec.lock
  seguridad-manifest:
    name: "Seguridad · AndroidManifest y build"
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Revisar permisos, respaldo y tráfico en claro
        run: python3 tools/ci/revisar_android.py src/mobile/nexo_app
  seguridad-workflows:
    name: "Seguridad · workflows (actionlint y permisos)"
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: actionlint v1.7.7
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Acciones fijadas por SHA y permisos mínimos
        run: python3 tools/ci/revisar_workflows.py
  seguridad-revision-dependencias:
    name: "Seguridad · revisión de dependencias del PR"
    needs: [pipeline]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  version:
    name: "Versión · matriz y SemVer"
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Versión del pubspec en docs/versionamiento.md y rama release
        id: v
        run: python3 tools/ci/versionamiento.py
  cobertura:
    name: "Calidad · cobertura combinada"
    needs: [unidad-almacen-local, unidad-api-modes, unidad-asistente-y-dispositivos-fake, unidad-auth-parsing, unidad-diseno-maqueta, unidad-fake-account, unidad-fake-discovery, unidad-fake-messages, unidad-fake-orders, unidad-fake-requests, unidad-filters, unidad-ml-categoria, unidad-models, unidad-publish-rules, unidad-push-mensajes, unidad-validation, integracion-cache-sin-conexion, integracion-http-asistente-dispositivos, integracion-http-cuenta, integracion-http-descubrimiento, integracion-http-guardados-contacto, integracion-http-imagenes, integracion-http-mensajes, integracion-http-pedidos, integracion-http-perfil, integracion-http-solicitudes-interes, integracion-push-controlador, integracion-resiliencia, integracion-sesion, integracion-sincronizacion, seguridad-cabeceras-y-subidas, seguridad-cache-local-seguro, seguridad-enlaces-profundos, seguridad-ia-sin-datos-personales, seguridad-privacidad, seguridad-push-seguro, seguridad-registros-sin-datos-sensibles, seguridad-secretos-en-codigo, seguridad-transporte]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Juntar la cobertura de cada prueba
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-*
          path: cobertura
          merge-multiple: true
      - name: Umbral de la constitución (§8)
        run: python3 tools/ci/cobertura.py cobertura --min ${{ vars.MIN_COVERAGE || '45' }} | tee -a "$GITHUB_STEP_SUMMARY"
  apk:
    name: "Construir · APK de prueba"
    needs: [cobertura, version, seguridad-secretos, seguridad-dependencias, seguridad-manifest, seguridad-workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: APK debug en modo auto (backend o datos de ejemplo)
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=LANDING_URL=${{ vars.LANDING_URL }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.app_version }}
      - name: Guardar APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-debug
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  ci-verde:
    name: "CI · todo verde"
    needs: [pipeline, preparar, formato, analisis, version, unidad-almacen-local, unidad-api-modes, unidad-asistente-y-dispositivos-fake, unidad-auth-parsing, unidad-diseno-maqueta, unidad-fake-account, unidad-fake-discovery, unidad-fake-messages, unidad-fake-orders, unidad-fake-requests, unidad-filters, unidad-ml-categoria, unidad-models, unidad-publish-rules, unidad-push-mensajes, unidad-validation, integracion-cache-sin-conexion, integracion-http-asistente-dispositivos, integracion-http-cuenta, integracion-http-descubrimiento, integracion-http-guardados-contacto, integracion-http-imagenes, integracion-http-mensajes, integracion-http-pedidos, integracion-http-perfil, integracion-http-solicitudes-interes, integracion-push-controlador, integracion-resiliencia, integracion-sesion, integracion-sincronizacion, seguridad-cabeceras-y-subidas, seguridad-cache-local-seguro, seguridad-enlaces-profundos, seguridad-ia-sin-datos-personales, seguridad-privacidad, seguridad-push-seguro, seguridad-registros-sin-datos-sensibles, seguridad-secretos-en-codigo, seguridad-transporte, seguridad-secretos, seguridad-dependencias, seguridad-manifest, seguridad-workflows, seguridad-revision-dependencias, cobertura, apk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ninguna prueba falló ni se canceló
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: python3 tools/ci/compuerta.py
  aab:
    name: "Construir · AAB firmado"
    needs: [ci-verde, version]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && (github.event_name == 'push' || inputs.publicar)
    environment: firma
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Flutter y dependencias
        uses: ./.github/actions/flutter
      - name: Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: La URL del backend de release es HTTPS
        env:
          URL: ${{ vars.API_BASE_URL }}
        run: |
          case "$URL" in https://*) echo "OK $URL";; *) echo "::error::API_BASE_URL debe ser https://"; exit 1;; esac
      - name: Aviso de privacidad en la landing (HTTPS)
        env:
          URL: ${{ vars.LANDING_URL }}
        run: |
          case "$URL" in https://*) echo "OK $URL";; *) echo "::error::Define LANDING_URL (https) para el aviso de privacidad"; exit 1;; esac
      - name: Firebase para push (google-services.json desde secretos)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'mx.nexolocal.nexo_app' }}
        run: python3 ../../../tools/ci/preparar_firebase.py android
      - name: Firma de subida (keystore desde secretos)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../../../tools/ci/preparar_firma.py android
      - name: AAB release
        run: >-
          flutter build appbundle --release
          --build-number=$(( ${{ github.run_number }} + ${{ vars.BUILD_NUMBER_OFFSET || 1000 }} ))
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=API_MODE=${{ vars.API_MODE || 'auto' }}
          --dart-define=LANDING_URL=${{ vars.LANDING_URL }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.app_version }}
          --obfuscate --split-debug-info=build/simbolos
      - name: Borrar la llave del runner
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks android/app/google-services.json
      - name: Guardar AAB y símbolos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aab-release
          path: |
            ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
            ${{ env.APP_DIR }}/build/simbolos
          retention-days: 30
  play-interna:
    name: "Play Store · pruebas internas"
    needs: [aab]
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aab-release
          path: salida
      - name: Subir a la pista internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'mx.nexolocal.nexo_app' }}
          releaseFiles: salida/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_STATUS || 'draft' }}
  play-produccion:
    name: "Play Store · producción"
    needs: [aab]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aab-release
          path: salida
      - name: Subir a la pista production
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'mx.nexolocal.nexo_app' }}
          releaseFiles: salida/app/outputs/bundle/release/app-release.aab
          track: production
          status: ${{ vars.PLAY_STATUS || 'draft' }}
