name: SDD documentation
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: SDD / docs
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6, verified from official repository
        with:
          path: App_NexoLocal
          persist-credentials: false
      - name: Validate documentary context and SDD
        shell: powershell
        run: ./App_NexoLocal/.ci/verify-sdd.ps1 -WorkspaceRoot "$env:GITHUB_WORKSPACE"
  flow:
    name: Git / flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          persist-credentials: false
      - name: Validate PR routing
        run: python3 .ci/check-branch-flow.py "$GITHUB_EVENT_PATH"
