name: SDD documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: SDD / docs
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from official repository
        with:
          path: App_NexoLocal
          persist-credentials: false
      - name: Validate documentary context and SDD
        shell: powershell
        run: ./App_NexoLocal/.ci/verify-sdd.ps1 -WorkspaceRoot "$env:GITHUB_WORKSPACE"
