name: Flutter del proyecto
description: Instala Flutter (versión fijada, con caché) y descarga dependencias de la app. Spec 047.
inputs:
  flutter-version:
    description: Versión de Flutter (la del equipo; Dart 3.7)
    default: '3.29.3'
  app-dir:
    description: Carpeta de la app
    default: src/mobile/nexo_app
runs:
  using: composite
  steps:
    - name: Flutter ${{ inputs.flutter-version }}
      uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
    - name: flutter pub get (con pubspec.lock fijo)
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      run: flutter pub get --enforce-lockfile
